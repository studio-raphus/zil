server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;   # keep the gateway's host:port in redirects

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  # Zil Studio (admin portal): its own page, never indexed by search engines
  location /admin/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-cache"; try_files $uri /admin/index.html; }
  location = /admin { return 301 /admin/; }
  location / { try_files $uri $uri/ /index.html; }
}
