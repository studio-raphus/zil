# Zil API gateway: one public origin, path-based routing to independent services.
# Swap for Kong, Traefik, an AWS/Azure/GCP API gateway or Kubernetes Ingress with the same paths.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 64k;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=writes:10m rate=1r/s;

  upstream catalog  { server catalog:3000; }
  upstream spots    { server spots:3000; }
  upstream live     { server live:3000; }
  upstream accounts { server accounts:3000; }
  upstream routing  { server routing:3000; }
  upstream tiles    { server tiles:80; }
  upstream frontend { server frontend:80; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/health { return 200 '{"status":"ok"}'; default_type application/json; }

    location /api/catalog/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://catalog/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/spots/ {
      limit_req zone=api burst=40 nodelay;
      limit_req zone=writes burst=5 nodelay;
      proxy_pass http://spots/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Server-Sent Events need buffering off and long timeouts
    location /api/live/v1/stream {
      proxy_pass http://live/v1/stream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/live/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://live/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sign-in with Google and sessions (HttpOnly cookie). Writes are rate-limited like spots.
    location /api/accounts/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://accounts/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Road routes (OSRM behind Zil's routing API)
    location /api/routing/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://routing/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Map tiles + fonts: many small range requests while panning, so no API rate limit here
    location /tiles/ {
      proxy_pass http://tiles/;
      proxy_set_header Host $host;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }
  }
}
