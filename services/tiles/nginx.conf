# Serves /mauritius.pmtiles (range requests) and /fonts/{stack}/{range}.pbf. Nothing else.
server {
  listen 80;
  root /usr/share/nginx/html;
  autoindex off;
  add_header Cache-Control "public, max-age=86400" always;
  add_header Access-Control-Allow-Origin "*" always;            # the Android app loads tiles from its own origin
  add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;
  add_header Access-Control-Allow-Headers "Range" always;

  location = /mauritius.pmtiles { default_type application/octet-stream; if ($request_method = OPTIONS) { return 204; } }
  location /fonts/ { default_type application/x-protobuf; if ($request_method = OPTIONS) { return 204; } }
  location = /health { default_type text/plain; return 200 'ok'; }
  location / { return 404; }
}
